<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS | Holographic Interface</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#020812;color:#b9f5ff;
 font-family:Arial,sans-serif;
}
#video{
 position:fixed;inset:0;width:100%;height:100%;
 object-fit:contain;transform:scaleX(-1);background:#020812;
}
#handCanvas,#threeCanvas{
 position:fixed;inset:0;width:100%;height:100%;
 pointer-events:none;
}
#handCanvas{z-index:3}
#threeCanvas{z-index:2}
body:after{
 content:"";position:fixed;inset:0;z-index:4;pointer-events:none;
 background:repeating-linear-gradient(
 transparent 0px,transparent 3px,
 rgba(0,220,255,.035) 4px
 );
}
.hud{
 position:fixed;z-index:8;top:15px;left:15px;
 font-size:12px;letter-spacing:3px;color:#52eaff;
 text-shadow:0 0 12px #00d9ff;
}
.status{
 position:fixed;z-index:8;top:42px;left:15px;
 font-size:10px;color:#8bcbd6;letter-spacing:2px;
}
.panel{
 position:fixed;z-index:10;top:85px;left:15px;
 width:245px;max-height:75vh;overflow:auto;
 padding:16px;background:rgba(2,18,32,.88);
 border:1px solid rgba(0,225,255,.65);
 box-shadow:0 0 22px rgba(0,190,255,.22),inset 0 0 20px #063044;
 backdrop-filter:blur(12px);
 transition:.25s;
}
.panel.hidden{transform:translateX(-120%);opacity:0;pointer-events:none}
.panel h3{
 margin:0 0 13px;color:#65edff;font-size:13px;
 letter-spacing:3px;
}
.section{
 margin:16px 0 8px;font-size:10px;color:#58cbdc;
 letter-spacing:2px;
}
button,.upload{
 display:block;width:100%;margin:7px 0;padding:11px 9px;
 background:rgba(0,180,220,.09);color:#b9f7ff;
 border:1px solid rgba(0,220,255,.5);
 font-size:11px;letter-spacing:1px;cursor:pointer;
 transition:.2s;
}
button:active,.upload:active{background:#087f9b;transform:scale(.97)}
button:hover,.upload:hover{background:rgba(0,220,255,.22);box-shadow:0 0 12px #00bce8}
.close{
 position:absolute;right:9px;top:8px;width:30px;height:28px;
 margin:0;padding:0;font-size:18px;
}
#openMenu{
 display:none;position:fixed;z-index:12;left:15px;top:85px;
 width:48px;height:45px;font-size:22px;
 background:rgba(0,20,35,.9);
}
#openMenu.show{display:block}
#cameraButton{border-color:#00ffc3;color:#8affdf}
#clearButton{border-color:#ff637f;color:#ff9aaa}
input[type=file]{display:none}
.bottom{
 position:fixed;z-index:8;bottom:15px;left:0;width:100%;
 text-align:center;font-size:10px;letter-spacing:2px;
 color:#57cfe4;text-shadow:0 0 10px #00cfff;
 pointer-events:none;
}
#message{
 position:fixed;z-index:15;bottom:45px;left:50%;
 transform:translateX(-50%);
 color:#aaf8ff;font-size:12px;text-align:center;
 background:rgba(0,20,35,.8);padding:9px 14px;
 border:1px solid #168ca8;max-width:90%;
}
.handInfo{
 position:fixed;right:15px;top:18px;z-index:8;
 font-size:10px;letter-spacing:2px;text-align:right;
 color:#65eaff;line-height:2;
}
@media(max-width:600px){
 .panel{width:215px;top:75px;max-height:76vh}
 .hud{font-size:10px}
 .bottom{font-size:8px}
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="handCanvas"></canvas>
<div id="threeCanvas"></div>

<div class="hud">J.A.R.V.I.S // HOLOGRAPHIC SYSTEM</div>
<div class="status" id="status">SYSTEM STANDBY</div>

<div class="handInfo" id="handInfo">
LEFT HAND: NOT DETECTED<br>
RIGHT HAND: NOT DETECTED
</div>

<button id="openMenu" class="show">☰</button>

<div class="panel" id="panel">
<button class="close" id="closeMenu">×</button>
<h3>JARVIS CONTROL</h3>

<button id="cameraButton">◉ ACTIVATE CAMERA</button>

<div class="section">CREATE HOLOGRAM</div>
<button data-shape="sphere">＋ SPHERE</button>
<button data-shape="cube">＋ CUBE</button>
<button data-shape="square">＋ SQUARE</button>
<button data-shape="torus">＋ TORUS</button>

<div class="section">IMAGE HOLOGRAM</div>
<label class="upload" for="imageUpload">＋ UPLOAD IMAGE</label>
<input type="file" id="imageUpload" accept="image/*">

<div class="section">OBJECT CONTROL</div>
<button id="duplicateButton">DUPLICATE SELECTED</button>
<button id="deleteButton">DELETE SELECTED</button>
<button id="clearButton">CLEAR ALL OBJECTS</button>

<div class="section">SYSTEM</div>
<button id="resetButton">RESET CAMERA VIEW</button>
</div>

<div class="bottom">JARVIS ONLINE // TWO-HAND TRACKING SYSTEM</div>
<div id="message">Press ACTIVATE CAMERA to begin</div>

<script>
const video=document.getElementById("video");
const handCanvas=document.getElementById("handCanvas");
const ctx=handCanvas.getContext("2d");
const panel=document.getElementById("panel");
const message=document.getElementById("message");
const statusText=document.getElementById("status");
const handInfo=document.getElementById("handInfo");

let cameraStream=null;
let handsModel=null;
let cameraRunning=false;
let busy=false;
let selected=null;
let objects=[];
let handPoints=[];
let previousPinch=false;
let activeHand=-1;
let scaleStart=null;
let baseScale=1;

const colors=[0x00eaff,0x00ffc3,0x39aaff,0x9b72ff];

const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-5,5,5,-5,.1,100);
camera.position.set(0,0,20);

const renderer=new THREE.WebGLRenderer({
 alpha:true,antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
document.getElementById("threeCanvas").appendChild(renderer.domElement);
renderer.domElement.style.width="100%";
renderer.domElement.style.height="100%";

scene.add(new THREE.AmbientLight(0xffffff,1));

function resize(){
 const w=innerWidth;
 const h=innerHeight;
 camera.left=-w/200;
 camera.right=w/200;
 camera.top=h/200;
 camera.bottom=-h/200;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
 handCanvas.width=Math.round(w*devicePixelRatio);
 handCanvas.height=Math.round(h*devicePixelRatio);
 handCanvas.style.width=w+"px";
 handCanvas.style.height=h+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize);
resize();

function getVideoRect(){
 const vw=video.videoWidth||640;
 const vh=video.videoHeight||480;
 const scale=Math.min(innerWidth/vw,innerHeight/vh);
 const width=vw*scale;
 const height=vh*scale;
 return {
  x:(innerWidth-width)/2,
  y:(innerHeight-height)/2,
  width,height
 };
}

function screenToWorld(x,y){
 return new THREE.Vector3(
  (x-innerWidth/2)/100,
  (innerHeight/2-y)/100,
  0
 );
}

function handToScreen(point){
 const r=getVideoRect();
 return {
  x:r.x+(1-point.x)*r.width,
  y:r.y+point.y*r.height
 };
}

function showMessage(text){
 message.textContent=text;
}

function createMaterial(color){
 return new THREE.MeshBasicMaterial({
  color:color,
  wireframe:true,
  transparent:true,
  opacity:.85
 });
}

function addHologram(type){
 let geometry;
 const color=colors[objects.length%colors.length];

 if(type==="sphere"){
  geometry=new THREE.IcosahedronGeometry(.65,2);
 }else if(type==="cube"){
  geometry=new THREE.BoxGeometry(1.1,1.1,1.1);
 }else if(type==="square"){
  geometry=new THREE.PlaneGeometry(1.3,1.3);
 }else if(type==="torus"){
  geometry=new THREE.TorusGeometry(.65,.2,12,48);
 }

 const material=createMaterial(color);
 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.set(
  (Math.random()-.5)*3,
  (Math.random()-.5)*2,
  0
 );

 mesh.userData={
  type:type,
  baseColor:color
 };

 scene.add(mesh);
 objects.push(mesh);
 selectObject(mesh);
 showMessage(type.toUpperCase()+" HOLOGRAM CREATED");
}

function selectObject(obj){
 if(selected){
  selected.material.opacity=.85;
 }
 selected=obj;
 if(selected){
  selected.material.opacity=1;
 }
}

function duplicateSelected(){
 if(!selected)return showMessage("SELECT AN OBJECT FIRST");
 const clone=selected.clone();
 clone.position.x+=.5;
 clone.position.y-=.4;
 scene.add(clone);
 objects.push(clone);
 selectObject(clone);
}

function deleteSelected(){
 if(!selected)return;
 scene.remove(selected);
 selected.geometry.dispose();
 selected.material.dispose();
 objects=objects.filter(o=>o!==selected);
 selected=null;
 showMessage("OBJECT DELETED");
}

function clearObjects(){
 objects.forEach(o=>{
  scene.remove(o);
  o.geometry.dispose();
  if(o.material.map)o.material.map.dispose();
  o.material.dispose();
 });
 objects=[];
 selected=null;
 showMessage("ALL HOLOGRAMS CLEARED");
}

function nearestObject(point){
 let nearest=null;
 let best=1.25;
 for(const obj of objects){
  const dx=obj.position.x-point.x;
  const dy=obj.position.y-point.y;
  const distance=Math.sqrt(dx*dx+dy*dy);
  if(distance<best){
   best=distance;
   nearest=obj;
  }
 }
 return nearest;
}

function makeImageHologram(file){
 const url=URL.createObjectURL(file);
 const img=new Image();

 img.onload=()=>{
  const texture=new THREE.Texture(img);
  texture.needsUpdate=true;

  const aspect=img.width/img.height;
  const width= Math.min(3,2*aspect);
  const height=width/aspect;

  const material=new THREE.MeshBasicMaterial({
   map:texture,
   transparent:true,
   opacity:.78,
   side:THREE.DoubleSide
  });

  const mesh=new THREE.Mesh(
   new THREE.PlaneGeometry(width,height),material
  );

  mesh.position.set(0,0,0);
  scene.add(mesh);
  objects.push(mesh);
  selectObject(mesh);

  const border=new THREE.LineSegments(
   new THREE.EdgesGeometry(mesh.geometry),
   new THREE.LineBasicMaterial({
    color:0x00eaff,transparent:true,opacity:.9
   })
  );
  mesh.add(border);

  showMessage("IMAGE HOLOGRAM CREATED");
  URL.revokeObjectURL(url);
 };
 img.src=url;
}

document.querySelectorAll("[data-shape]").forEach(button=>{
 button.addEventListener("click",()=>{
  addHologram(button.dataset.shape);
 });
});

document.getElementById("duplicateButton").onclick=duplicateSelected;
document.getElementById("deleteButton").onclick=deleteSelected;
document.getElementById("clearButton").onclick=clearObjects;

document.getElementById("imageUpload").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(file)makeImageHologram(file);
 e.target.value="";
});

document.getElementById("closeMenu").onclick=()=>{
 panel.classList.add("hidden");
 document.getElementById("openMenu").classList.add("show");
};
document.getElementById("openMenu").onclick=()=>{
 panel.classList.remove("hidden");
 document.getElementById("openMenu").classList.remove("show");
};

document.getElementById("resetButton").onclick=()=>{
 objects.forEach(o=>o.rotation.set(0,0,0));
 showMessage("HOLOGRAM VIEW RESET");
};

function drawHands(results){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 handPoints=[];

 const all=results.multiHandLandmarks||[];
 const labels=results.multiHandedness||[];

 let left=false,right=false;

 all.forEach((landmarks,index)=>{
  const label=labels[index]?.label||"Hand";
  if(label==="Left")left=true;
  if(label==="Right")right=true;

  const pts=landmarks.map(handToScreen);
  handPoints.push({
   points:landmarks,
   screen:pts,
   label
  });

  const color=index===0?"#00f6ff":"#00ffad";
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.lineWidth=2;
  ctx.shadowColor=color;
  ctx.shadowBlur=10;

  for(const connection of HAND_CONNECTIONS){
   const a=pts[connection[0]];
   const b=pts[connection[1]];
   ctx.beginPath();
   ctx.moveTo(a.x,a.y);
   ctx.lineTo(b.x,b.y);
   ctx.stroke();
  }

  pts.forEach((p,i)=>{
   ctx.beginPath();
   ctx.arc(p.x,p.y,i===8||i===4?6:3,0,Math.PI*2);
   ctx.fill();
  });
 });

 ctx.shadowBlur=0;

 handInfo.innerHTML=
  "LEFT HAND: "+(left?"TRACKING":"NOT DETECTED")+
  "<br>RIGHT HAND: "+(right?"TRACKING":"NOT DETECTED");
}

function isPinching(landmarks){
 const thumb=landmarks[4];
 const index=landmarks[8];
 const dx=thumb.x-index.x;
 const dy=thumb.y-index.y;
 return Math.sqrt(dx*dx+dy*dy)<.055;
}

function processGestures(results){
 const all=results.multiHandLandmarks||[];
 const pinching=[];

 all.forEach((landmarks,index)=>{
  if(isPinching(landmarks)){
   const p=handToScreen(landmarks[8]);
   pinching.push({
    index,
    point:screenToWorld(p.x,p.y)
   });
  }
 });

 // Two hands pinching: resize the selected hologram.
 if(pinching.length===2 && selected){
  const a=pinching[0].point;
  const b=pinching[1].point;
  const distance=a.distanceTo(b);

  if(scaleStart===null){
   scaleStart=distance;
   baseScale=selected.scale.x;
  }else{
   const factor=distance/Math.max(scaleStart,.01);
   const newScale=THREE.MathUtils.clamp(baseScale*factor,.25,4);
   selected.scale.setScalar(newScale);
  }
  previousPinch=true;
  activeHand=-1;
  return;
 }

 scaleStart=null;

 // One hand pinching: select and drag.
 if(pinching.length===1){
  const gesture=pinching[0];

  if(!previousPinch || activeHand!==gesture.index){
   const found=nearestObject(gesture.point);
   if(found){
    selectObject(found);
    activeHand=gesture.index;
   }else{
    activeHand=-1;
   }
  }

  if(selected && activeHand===gesture.index){
   selected.position.x=gesture.point.x;
   selected.position.y=gesture.point.y;
  }

  previousPinch=true;
 }else{
  previousPinch=false;
  activeHand=-1;
 }
}

function onResults(results){
 drawHands(results);
 processGestures(results);

 if(handPoints.length){
  statusText.textContent="SYSTEM ACTIVE // "+handPoints.length+" HAND(S) TRACKED";
 }else{
  statusText.textContent="SYSTEM ACTIVE // WAITING FOR HANDS";
 }
}

async function startCamera(){
 try{
  showMessage("REQUESTING CAMERA ACCESS...");

  cameraStream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480},
    frameRate:{ideal:30,max:30}
   }
  });

  video.srcObject=cameraStream;
  await video.play();

  handsModel=new Hands({
   locateFile:file=>
    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
  });

  handsModel.setOptions({
   maxNumHands:2,
   modelComplexity:0,
   minDetectionConfidence:.65,
   minTrackingConfidence:.6
  });

  handsModel.onResults(onResults);

  cameraRunning=true;
  statusText.textContent="CAMERA ONLINE";
  showMessage("JARVIS ONLINE // SHOW BOTH HANDS");

  document.getElementById("cameraButton").textContent="● CAMERA ACTIVE";
  runTracking();

 }catch(error){
  console.error(error);
  showMessage("CAMERA ERROR: "+error.message);
  statusText.textContent="CAMERA ERROR";
 }
}

async function runTracking(){
 if(!cameraRunning)return;

 if(!busy && video.readyState>=2){
  busy=true;
  try{
   await handsModel.send({image:video});
  }catch(error){
   console.error("Tracking error:",error);
  }
  busy=false;
 }
 requestAnimationFrame(runTracking);
}

document.getElementById("cameraButton").onclick=()=>{
 if(!cameraRunning)startCamera();
};

function animate(){
 requestAnimationFrame(animate);

 const time=performance.now()*.001;

 objects.forEach(obj=>{
  obj.rotation.x+=.002;
  obj.rotation.y+=.003;

  if(obj===selected){
   obj.material.opacity=.8+Math.sin(time*4)*.18;
  }
 });

 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
